name: AbasonPlus Daily WordPress Post by Email
# Daily 06:20 UTC automatic WordPress email publication; manual workflow runs preview ONLY.
on:
  schedule:
    - cron: '20 6 * * *' # 08:20 CEST / 07:20 CET
  workflow_dispatch:
    inputs:
      preview_only:
        description: 'Prepare safely; do not send email'
        required: false
        default: 'true'
permissions:
  contents: read
concurrency:
  group: abasonplus-wordpress-email-one-per-day
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Check safe email source code
        run: python3 -m py_compile wordpress_email_prepare.py wordpress_email_send.py scripts/verify_wordpress_publication.py
      - name: Prepare next reviewed unpublished article with a public duplicate check
        run: python3 wordpress_email_prepare.py
      - name: Save email preview (no publication)
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-postbyemail-preview
          path: output/wordpress_email_preview.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Send exactly one approved article on SCHEDULED runs only
        if: ${{ github.event_name == 'schedule' }} # manual run remains preview-only
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          ABASONPLUS_PUBLISH: 'OWNER_APPROVED'
          ABASONPLUS_POST_BY_EMAIL_READY: 'CONFIRMED'
        run: python3 wordpress_email_send.py
      - name: Verify the article is actually published on WordPress, not merely accepted by Make
        if: ${{ github.event_name == 'schedule' }}
        run: python3 scripts/verify_wordpress_publication.py --attempts 6 --interval 35
      - name: Archive send receipt and public post verification result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abasonplus-wordpress-publication-audit
          path: |
            output/wordpress_send_receipt.json
            output/wordpress_published_verified.json
          if-no-files-found: ignore
          retention-days: 7
# GitHub does not need WORDPRESS_ACCESS_TOKEN; WordPress receives email via authorized Make Gmail.
