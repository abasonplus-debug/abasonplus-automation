name: AbasonPlus Daily WordPress Post
# Publishing paused at user's request. No scheduled, push or manual triggers.
on:
  workflow_dispatch:
    inputs:
      preview_only:
        description: 'Preview only; publishing is disabled'
        required: false
        default: 'true'
permissions:
  contents: read
concurrency:
  group: abasonplus-wordpress-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Publish next reviewed Bengali post
        if: ${{ false }} # Disabled: do not publish without fresh approval
        env:
          WORDPRESS_ACCESS_TOKEN: ${{ secrets.WORDPRESS_ACCESS_TOKEN }}
          WPCOM_SITE_ID: "257973809"
        run: python3 wordpress_publish.py
