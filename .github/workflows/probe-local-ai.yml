name: AbasonPlus Free Local AI Smoke Test — NO POSTS
on:
  push:
    branches: [main]
    paths:
      - 'tests/probe_local_ai.py'
      - '.github/workflows/probe-local-ai.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install local CPU model server
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve >/tmp/ollama-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:11434/api/tags >/dev/null && break
            sleep 2
          done
          curl -fsS http://localhost:11434/api/tags >/dev/null
      - name: Pull free 2.5 GB open model
        run: ollama pull qwen3:4b-instruct
      - name: Check JSON and Bengali content
        run: python3 tests/probe_local_ai.py
# This job does NOT call publishing services or paid AI inference.
