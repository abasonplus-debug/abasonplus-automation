name: AbasonPlus TikTok MP4 Transport Probe (NO TIKTOK POSTS)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-tiktok-transport.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-media-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install free open-source FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Create a tiny synthetic transport-only MP4
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i color=c=black:s=360x640:r=30 \
            -f lavfi -i sine=frequency=300:sample_rate=44100 \
            -t 3 -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
            -c:a aac -b:a 48k -movflags +faststart /tmp/transport-only.mp4
          test -s /tmp/transport-only.mp4
          printf 'SOURCE_VIDEO_BYTES='; wc -c </tmp/transport-only.mp4
          printf 'SOURCE_VIDEO_MD5='; md5sum /tmp/transport-only.mp4 | cut -d' ' -f1
      - name: Send safe, non-publishing MP4 binary to Zernio presign-and-upload route
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: |
          test -n "$MAKE_WEBHOOK_URL" || { echo "Missing webhook"; exit 1; }
          curl --fail-with-body --silent --show-error --max-time 40 \
            -F "kind=tiktok_transport_probe" \
            -F "review_approved=false" \
            -F "video=@/tmp/transport-only.mp4;type=video/mp4" \
            "$MAKE_WEBHOOK_URL" >/dev/null
          echo "Transport probe accepted by Make. Check independent Make execution for actual Zernio upload; NO TikTok post."
# This workflow has no social-platform publishing action. Zernio test media auto-expires.
