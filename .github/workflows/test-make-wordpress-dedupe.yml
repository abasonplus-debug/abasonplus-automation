name: AbasonPlus Make Approval Gate Regression - NO POSTS
on:
  push:
    branches: [main]
    paths: ['.github/workflows/test-make-wordpress-dedupe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reject-unapproved:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send four explicitly unapproved gate probes without media
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: |
          test -n "$MAKE_WEBHOOK_URL"
          for KIND in video wordpress_email tiktok_reviewed_publish instagram_video; do
            export KIND
            python3 - <<'PY' > /tmp/gate-probe.json
          import json,os
          print(json.dumps({"kind":os.environ["KIND"],"review_approved":"false",
            "visual_qa_passed":"false","tiktok_publish_approved":"false",
            "express_consent_given":"false","content_preview_confirmed":"false",
            "status":"preview_only","post_key":"AUDIT_NO_POST",
            "subject":"Unapproved gate probe; never publish"}))
          PY
            curl --silent --show-error --fail-with-body --max-time 25 --retry 0 \
              -H 'Content-Type: application/json' \
              --data-binary @/tmp/gate-probe.json "$MAKE_WEBHOOK_URL" -o /tmp/gate-response.txt
            echo "Unapproved $KIND probe delivered; inspect Make to confirm zero publishing modules ran."
          done
# These probes deliberately do not exercise the daily reserve or any publisher.
