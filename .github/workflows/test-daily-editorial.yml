name: AbasonPlus Live Editorial End-to-End Preview — NO POSTS
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-draft-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install local photo and Bengali rendering tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core
          python3 -m pip install -r requirements.txt
      - name: Restore semantic photo models
        uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: abasonplus-clip-v1-${{ runner.os }}
      - name: Check source-linked today's article and prevent duplicate WordPress post
        run: python3 wordpress_email_prepare.py
      - name: Validate matching five-slide editorial
        run: python3 scripts/select_video_story.py
      - name: Render licensed, source-matched video with original music without posting
        env:
          ABASONPLUS_DAILY_STORY: output/daily_research_story.json
          ABASONPLUS_MODEL_CACHE: .cache/fastembed
        run: python3 scripts/create_carousel.py
      - name: Verify machine-ready photo release without publishing
        run: python3 scripts/verify_video_release.py
      - name: Prepare TikTok-specific caption and video package (NO TikTok posting)
        run: python3 scripts/prepare_tiktok_preview.py
      - name: Validate zero-publish preview content
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json,subprocess
          out=Path('output')
          email_preview=out/'wordpress_email_preview.json'
          if email_preview.exists():
              article=json.loads(email_preview.read_text(encoding='utf-8'))
              assert article['review_approved']=='false' and article['status']=='preview_only'
          else:
              print('WordPress article may already be published; no email preview or resend required.')
          story=json.loads((out/'daily_research_story.json').read_text(encoding='utf-8'))
          report=json.loads((out/'metadata.json').read_text(encoding='utf-8'))
          assert report['source_url']==story['source_url'] and 5<=report['slides']<=25
          assert (out/'video_qa_passed.txt').exists()
          tt=json.loads((out/'tiktok_preview.json').read_text(encoding='utf-8'))
          assert tt['status']=='preview_only' and not tt['posting_enabled']
          assert tt['source_url']==story['source_url'] and tt['format']['width']==1080
          assert report['style_id']=='compact_white_gold_v2'
          from scripts.carousel_style import validate_style
          for quality_record in report['quality']: validate_style(quality_record)
          assert len(report['quality'])==report['slides']
          assert len({x['source'] for x in report['quality']})==report['slides']
          assert all(x['font_px']>=120 and x['style_id']==report['style_id']
                     and x['text_background'] is False and x['text_stroke'] is True
                     and x['photo_overlay'] is False and x['photo_semantic_qa'] is True
                     and len(x['line_background_stats'])==x['text_lines']
                     and all(len(row)==3 and row[1]<=80 and row[2]<=45 for row in x['line_background_stats'])
                     for x in report['quality'])
          for i in range(meta['slides']):
              with Image.open(out/f'slide_{i}.png') as im: assert im.size==(1080,1920)
          assert (out/'thumbnail.png').read_bytes()==(out/'slide_0.png').read_bytes()
          meta=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-of','json',str(out/'abasonplus_daily.mp4')]))
          assert any(s['codec_type']=='audio' for s in meta['streams'])
          print('SOURCED POST + LICENSED 5 SLIDE VIDEO QA: PASS, PUBLICATIONS SENT: 0')
          PY
      - name: Upload ONLY private preview artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abasonplus-daily-editorial-preview
          path: |
            output/slide_*.png
            output/thumbnail.png
            output/abasonplus_daily.mp4
            output/metadata.json
            output/wordpress_email_preview.json
            output/image_credits.txt
            output/tiktok_caption.txt
            output/tiktok_preview.json
          if-no-files-found: ignore
          retention-days: 3
# This workflow contains NO webhook, Gmail, WordPress or social publishing calls.

