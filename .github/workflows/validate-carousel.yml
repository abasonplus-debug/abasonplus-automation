name: AbasonPlus Safe Code Validation
on:
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', 'wordpress*.py', 'content/**', '.github/workflows/**', 'requirements.txt']
  pull_request:
    paths: ['scripts/**', 'tests/**', 'wordpress*.py', 'content/**', '.github/workflows/**', 'requirements.txt']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Bengali fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core ffmpeg
          python -m pip install -r requirements.txt
      - name: Compile Python without running publishers
        run: python -m py_compile scripts/create_carousel.py scripts/photo_relevance.py scripts/verify_video_release.py scripts/prepare_tiktok_preview.py wordpress_publish.py
      - name: Validate topics, typography and scheduled publishing gates
        run: python tests/validate_carousel.py
      - name: Run publication policy regression tests without network or publishing
        run: python -m unittest discover -s tests -p 'test_*.py' -v
# Static/fixture checks only on code changes; full creative renders use the explicit preview workflow.
