name: AbasonPlus Make Video Schema — NEVER PUBLISH
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-make-video-schema.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  harmless-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Send an UNAPPROVED tiny test to learn both webhook field types
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        shell: bash
        run: |
          test -n "$MAKE_WEBHOOK_URL" || exit 1
          ffmpeg -f lavfi -i color=c=black:s=320x568:r=1 -t 1 -c:v libx264 -pix_fmt yuv420p -y /tmp/schema-only.mp4 -loglevel error
          curl --silent --show-error --fail-with-body --max-time 40 --retry 0 \
            -F 'kind=video' \
            -F 'review_approved=false' \
            -F 'visual_qa_passed=false' \
            -F 'status=preview_only' \
            -F 'post_key=SCHEMA_ONLY_NEVER_POST' \
            -F 'subject=Nonpublishing schema sample' \
            --form-string 'html_content=<p>Nonpublishing schema sample</p>' \
            -F 'title=Schema test — DO NOT PUBLISH' \
            -F 'caption=Schema test — DO NOT PUBLISH' \
            -F 'description=Schema test — DO NOT PUBLISH' \
            -F 'video=@/tmp/schema-only.mp4;type=video/mp4' \
            "$MAKE_WEBHOOK_URL" >/dev/null
          echo 'NONPUBLISHING video and email schema sent: review_approved=false'
# Both Make social and WordPress routes require review_approved=true; therefore ZERO posts.
