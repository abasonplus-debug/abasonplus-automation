name: AbasonPlus Daily Source-Checked Carousel & Video
on:
  push:
    branches: [main]
    paths: ['previews/tiktok/current.json']
  schedule:
    - cron: '30 0 * * *' # Owner-selected daily 00:30 Europe/Berlin video trigger
      timezone: 'Europe/Berlin'
    - cron: '31 1 * * *' # Backup ONLY when no earlier scheduled attempt exists today
      timezone: 'Europe/Berlin'
  workflow_dispatch:
    inputs:
      preview_only:
        description: 'Manual runs never publish'
        required: false
        default: 'true'
permissions:
  contents: read
  actions: read
concurrency:
  group: abasonplus-video-one-source-per-day
  cancel-in-progress: false
jobs:
  schedule-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    outputs:
      allowed: ${{ steps.elect.outputs.allowed }}
      day: ${{ steps.elect.outputs.day }}
    steps:
      - uses: actions/checkout@v7
      - name: Elect one scheduled attempt; never replay an existing delivery
        id: elect
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/schedule_guard.py --workflow daily-carousel.yml
  source:
    needs: schedule-gate
    if: ${{ needs.schedule-gate.outputs.allowed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    outputs:
      editorial_sha: ${{ steps.wait.outputs.editorial_sha }}
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
      - name: Wait for today's missing editorial before preparation (NO POSTS)
        id: wait
        run: python3 scripts/wait_daily_editorial.py
      - name: Require ChatGPT's source-checked editorial for today
        id: check
        run: |
          if python3 scripts/select_video_story.py; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            code=$?
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::Daily editorial unavailable or invalid (exit $code); no video published."
            echo "## Video blocked before rendering — source validation failed" >> "$GITHUB_STEP_SUMMARY"
            exit "$code"
          fi
  render-and-publish:
    needs: [source, schedule-gate]
    if: ${{ needs.source.outputs.ready == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.source.outputs.editorial_sha }}
      - name: Install free local rendering/photograph QA tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core
          python3 -m pip install -r requirements.txt
      - name: Restore local semantic photo models across scheduled runs
        uses: actions/cache@v6
        with:
          path: .cache/fastembed
          key: abasonplus-clip-v1-${{ runner.os }}
      - name: Check mixed Bengali and Latin glyph routing (NO POSTS)
        run: python3 -m unittest discover -s tests -p 'test_bilingual_text.py' -v
      - name: Check new variable-slide news story
        run: python3 scripts/select_video_story.py
      - name: Apply owner-requested photo correction to PREVIEW output only
        if: ${{ github.event_name == 'push' }}
        run: python3 scripts/apply_preview_photo.py
      - name: Render original 9:16 Bengali slides and music MP4
        env:
          ABASONPLUS_DAILY_STORY: output/daily_research_story.json
          ABASONPLUS_MODEL_CACHE: .cache/fastembed
        run: python3 scripts/create_carousel.py
      - name: Generate full slide-by-slide Bengali voice with selected CosyVoice3 Deep Male (fail closed)
        timeout-minutes: 150
        run: python3 scripts/cosyvoice3_daily_voiceover.py
      - name: Verify dimensions, exact narrated text, and visual layout before ANY publication
        run: |
          python3 - <<'PY'
          from PIL import Image
          import json,pathlib,subprocess
          out=pathlib.Path('output')
          meta=json.loads((out/'metadata.json').read_text(encoding='utf-8'))
          news=json.loads((out/'daily_research_story.json').read_text(encoding='utf-8'))
          assert meta['source_url']==news['source_url']
          from scripts.carousel_timing import MIN_SLIDES, MAX_SLIDES
          assert MIN_SLIDES<=meta['slides']<=MAX_SLIDES and len(meta['quality'])==meta['slides']
          assert meta['verified_on']==news['verified_on']
          assert meta['style_id']=='compact_white_gold_v2'
          from scripts.carousel_style import validate_style
          for quality_record in meta['quality']: validate_style(quality_record)
          assert all(x['font_px']>=120 and x['style_id']==meta['style_id'] and
                     x['text_background'] is False and x['text_stroke'] is True and
                     x['photo_overlay'] is False and
                     x['logo_position'] in ('bottom_right','omitted_unavailable')
                     for x in meta['quality'])
          assert all((out/f'slide_{i}.png').is_file() for i in range(meta['slides']))
          for i in range(meta['slides']):
              with Image.open(out/f'slide_{i}.png') as im: assert im.size==(1080,1920)
          assert (out/'thumbnail.png').read_bytes()==(out/'slide_0.png').read_bytes()
          vid=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',str(out/'abasonplus_daily.mp4')]))
          assert any(s['codec_type']=='video' and s['width']==1080 and s['height']==1920 for s in vid['streams'])
          assert any(s['codec_type']=='audio' and s['codec_name']=='aac' for s in vid['streams'])
          from scripts.carousel_timing import validate_timing
          validate_timing(meta, float(vid['format']['duration']))
          import sys
          sys.path.insert(0, str(pathlib.Path('scripts').resolve()))
          from cosyvoice3_daily_voiceover import verify_voiceover
          verify_voiceover(out, news, meta)
          assert len((out/'image_credits.txt').read_text(encoding='utf-8').strip().splitlines())==meta['slides']
          print("AUTO VIDEO QA PASS: original licensed photos, 9:16 slides, exact-source Dan Mason CosyVoice3 narration, aligned timing, original background music.")
          PY
      - name: Approve release ONLY after separate real-photo and metadata QA
        run: python3 scripts/verify_video_release.py
      - name: Prepare TikTok-specific caption and video package (NO TikTok posting)
        run: python3 scripts/prepare_tiktok_preview.py
      - name: Save video, slides and license/source QA results
        uses: actions/upload-artifact@v7
        with:
          name: abasonplus-source-checked-video
          path: |
            output/*.mp4
            output/slide_*.png
            output/thumbnail.png
            output/thumbnail_upload.jpg
            output/metadata.json
            output/narration_segments/slide_*.wav
            output/voiceover_manifest.json
            output/cosyvoice3_narration.wav
            output/daily_research_story.json
            output/mobile_qa_contact_sheet.jpg
            output/mobile_qa_notes.json
            output/image_credits.txt
            output/title.txt
            output/caption.txt
            output/instagram_caption.txt
            output/description.txt
            output/tiktok_caption.txt
            output/first_comment.txt
            output/first_comment_json.txt
            output/engagement_pack.json
            output/tiktok_preview.json
          retention-days: 7
      - name: Preserve failure diagnostics (NO POSTS)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: abasonplus-failure-diagnostics
          path: |
            output/daily_research_story.json
            output/photo_preflight.json
            output/*.mp4
            output/*.wav
            output/narration_segments/slide_*.wav
            output/voiceover_manifest.json
            output/metadata.json
            output/slide_*.png
            output/thumbnail*
            output/*.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Send ONE daily validated Reel and Short to Make on automatic schedule ONLY
        if: ${{ github.event_name == 'schedule' }}
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          ABASONPLUS_RUN_DAY: ${{ needs.schedule-gate.outputs.day }}
        run: |
          python3 scripts/schedule_guard.py --check-day "$ABASONPLUS_RUN_DAY"
          test -n "$MAKE_WEBHOOK_URL" || { echo 'Missing Make webhook; no publication'; exit 1; }
          test -f output/video_qa_passed.txt || { echo 'No automatic photo quality approval; no publication'; exit 1; }
          VIDEO_BYTES="$(wc -c < output/abasonplus_daily.mp4)"
          THUMB_BYTES="$(wc -c < output/thumbnail_upload.jpg)"
          if [ "$((VIDEO_BYTES + THUMB_BYTES + 75000))" -gt 5000000 ]; then
            echo "## Voiceover video rendered in full, but delivery stopped safely" >> "$GITHUB_STEP_SUMMARY"
            echo "The script-length MP4 is stored as an Actions artifact. The current Make FREE webhook cannot take this payload. Nothing paid or trial was used; nothing posted." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Free Make 5MB payload limit reached. Full narrated video is preserved as artifact. NO POSTS and NO PAID SERVICES."
            exit 1
          fi
          VIDEO_SHA256="$(sha256sum output/abasonplus_daily.mp4 | cut -d ' ' -f1)"
          curl --fail-with-body --max-time 120 --retry 0 \
            -F "kind=video" \
            -F "review_approved=true" \
            -F "visual_qa_passed=true" \
            -F "visual_style_id=compact_white_gold_v2" \
            -F "video_sha256=$VIDEO_SHA256" \
            -F "video=@output/abasonplus_daily.mp4;type=video/mp4" \
            -F "title=<output/title.txt" \
            -F "caption=<output/caption.txt" \
            -F "instagram_caption=<output/instagram_caption.txt" \
            -F "first_comment=<output/first_comment.txt" \
            -F "first_comment_json=<output/first_comment_json.txt" \
            -F "thumbnail=@output/thumbnail_upload.jpg;type=image/jpeg" \
            -F "description=<output/description.txt" \
            -F "tiktok_caption=<output/tiktok_caption.txt" \
            -F "tiktok_post_key=abasonplus-tiktok-$(TZ=Europe/Berlin date +%F)" \
            -F "tiktok_publish_approved=false" \
            "$MAKE_WEBHOOK_URL"
# Manual dispatch is PREVIEW ONLY. No daily verified story -> NO VIDEO, never fake a live project photo.

