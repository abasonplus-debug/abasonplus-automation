name: AbasonPlus Daily Carousel
# Publishing paused at user's request. No scheduled, push or manual triggers.
on:
  workflow_dispatch:
    inputs:
      preview_only:
        description: 'Preview only; publishing is disabled'
        required: false
        default: 'true'
permissions:
  contents: read
concurrency:
  group: abasonplus-carousel-preview
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core
          python -m pip install -r requirements.txt
      - name: Render MP4
        run: python scripts/create_carousel.py
      - name: Save video artifact
        uses: actions/upload-artifact@v4
        with:
          name: abasonplus-carousel
          path: |
            output/abasonplus_daily.mp4
            output/slide_*.png
            output/thumbnail.png
            output/metadata.json
            output/title.txt
            output/caption.txt
            output/description.txt
            output/image_credits.txt
          retention-days: 7
      - name: Send to Make webhook when configured
        if: ${{ false }} # Disabled: do not publish without fresh approval
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: |
          curl --fail-with-body --retry 2 --max-time 120 \
            -F "video=@output/abasonplus_daily.mp4;type=video/mp4" \
            -F "title=<output/title.txt" \
            -F "caption=<output/caption.txt" \
            -F "description=<output/description.txt" \
            "$MAKE_WEBHOOK_URL"
