name: AbasonPlus Exact Own TikTok Comment 2026-10-30
on:
  push:
    paths: ['audits/comment-requests/2026-10-30-tiktok.json']
permissions:
  contents: read
concurrency:
  group: exact-brand-comment-tiktok-7702355853663309088
  cancel-in-progress: false
jobs:
  comment-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: One approved brand comment on verified own TikTok post; no video upload
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          from datetime import datetime,timedelta
          from zoneinfo import ZoneInfo
          from urllib.request import Request,urlopen
          now=datetime.now(ZoneInfo('Europe/Berlin'))
          assert now.date().isoformat()=='2026-10-30'
          r=json.loads(Path('audits/comment-requests/2026-10-30-tiktok.json').read_text())
          a=json.loads(Path('audits/tiktok-approvals/2026-10-30.json').read_text())
          p=json.loads(Path('audits/tiktok-publications/2026-10-30.json').read_text())
          assert p['status']=='published' and p['post_id']=='7702355853663309088' and p['video_sha256']==a['video_sha256']
          assert r['post_id']==p['post_id'] and r['publication_verified'] and r['no_own_matching_comment'] and r['pagination_complete']
          assert r['first_comment']==a['first_comment'] and 1<=len(r['first_comment'])<=500
          assert timedelta(0)<=now-datetime.fromisoformat(r['comments_observed_at'])<=timedelta(minutes=5)
          assert r['quota_remaining']>=24 and r['reserve']==20
          payload={'kind':'publish_first_comment','comment_platform':'tiktok','comment_post_id':r['post_id'],'platform_publication_verified':True,'comment_owner_approved':True,'first_comment':r['first_comment']}
          try:
              req=Request(os.environ['MAKE_WEBHOOK_URL'],data=json.dumps(payload,ensure_ascii=False).encode(),headers={'Content-Type':'application/json','Idempotency-Key':'abasonplus-first-comment-tiktok-7702355853663309088'},method='POST')
              with urlopen(req,timeout=90) as response:
                  assert 200<=response.status<300
                  response.read(4096)
              print('One exact approved brand comment requested; inspect module47 and own-comment readback. Never resend.')
          except Exception:
              raise RuntimeError('Comment outcome uncertain; reconcile, never resend') from None
          PY
