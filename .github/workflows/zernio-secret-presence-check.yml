name: AbasonPlus Zernio Existing GitHub Credential Check — NO POSTS
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zernio-secret-presence-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-secret-presence:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check only if an EXISTING authorized Zernio secret is available
        env:
          ZERNIO_KEY: ${{ secrets.ZERNIO_API_KEY }}
        run: |
          if test -n "$ZERNIO_KEY"; then
            echo "ZERNIO_EXISTING_GITHUB_SECRET=YES; no value shown and no API call."
          else
            echo "ZERNIO_EXISTING_GITHUB_SECRET=NO; use existing Make connection when available."
          fi
          echo "NO TIKTOK POST, NO API KEY CREATION, NO SECRET DISCLOSURE."
