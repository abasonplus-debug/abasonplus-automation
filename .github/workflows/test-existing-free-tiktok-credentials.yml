name: AbasonPlus Free TikTok Alternative Credential Check - NO POSTS
on:
  push:
    branches: [main]
    paths: ['.github/workflows/test-existing-free-tiktok-credentials.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-presence-without-disclosing-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
      ZERNIO_ACCESS_TOKEN: ${{ secrets.ZERNIO_ACCESS_TOKEN }}
      GETLATE_API_KEY: ${{ secrets.GETLATE_API_KEY }}
      LATE_API_KEY: ${{ secrets.LATE_API_KEY }}
      MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
      MAKE_API_KEY: ${{ secrets.MAKE_API_KEY }}
      MAKE_ACCESS_TOKEN: ${{ secrets.MAKE_ACCESS_TOKEN }}
      MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
    steps:
      - name: Report only presence of existing secrets - no network requests
        run: |
          python3 - <<'PY'
          import os
          keys=["ZERNIO_API_KEY","ZERNIO_ACCESS_TOKEN","GETLATE_API_KEY",
                "LATE_API_KEY","MAKE_API_TOKEN","MAKE_API_KEY",
                "MAKE_ACCESS_TOKEN","MAKE_WEBHOOK_URL"]
          for name in keys:
              print(name+"_PRESENT="+("YES" if os.getenv(name) else "NO"))
          print("NO CREDENTIAL VALUES, NO PUBLISH, NO WEBHOOK, NO PAYMENT")
          PY
